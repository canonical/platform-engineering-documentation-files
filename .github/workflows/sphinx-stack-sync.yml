name: Sync from sphinx-stack

on:
  schedule:
    - cron: "0 6 * * 6" # Weekly on Saturday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      sync: ${{ steps.check.outputs.sync }}
      old_version: ${{ steps.check.outputs.current }}
      new_version: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Get latest sphinx-stack release
        id: release
        run: |
          TAG=$(curl -sS https://api.github.com/repos/canonical/sphinx-stack/releases/latest | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to fetch latest release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if update needed
        id: check
        run: |
          VERSION_FILE="template/.sphinx-stack-version"
          LATEST="${{ steps.release.outputs.tag }}"

          if [ ! -f "$VERSION_FILE" ]; then
            mkdir -p "$(dirname "$VERSION_FILE")"
            echo "$LATEST" > "$VERSION_FILE"
            echo "Initialized version tracking to $LATEST. No sync needed."
            echo "sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(cat "$VERSION_FILE")
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already at latest version $LATEST. No sync needed."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New version available: $LATEST (current: $CURRENT)"
          echo "sync=true" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        if: steps.check.outputs.sync == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: actions/setup-python@v7
        if: steps.check.outputs.sync == 'true'
        with:
          python-version: "3.14"

        # Downloads the full upstream release snapshot and applies the ownership
        # policy in scripts/sphinx_stack_sync_policy.json. No upstream file names
        # are hardcoded here: files added or removed upstream are classified by
        # the policy and tracked in scripts/sphinx_stack_sync_state.json. When
        # the state file does not exist yet, it is bootstrapped from the snapshot
        # of the previously synced release.
      - name: Sync files from upstream snapshot
        id: sync
        if: steps.check.outputs.sync == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail
          ARGS=(--ref "$TAG" \
            --report-json "$RUNNER_TEMP/sync-report.json" \
            --report-md "$RUNNER_TEMP/sync-report.md")
          if [ -n "$CURRENT" ]; then
            ARGS+=(--baseline-ref "$CURRENT")
          fi
          python3 scripts/sync_sphinx_stack.py "${ARGS[@]}"

          cat "$RUNNER_TEMP/sync-report.md" >> "$GITHUB_STEP_SUMMARY"
          DELIM="REPORT_$(openssl rand -hex 16)"
          {
            echo "report<<$DELIM"
            cat "$RUNNER_TEMP/sync-report.md"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Upload sync report
        if: steps.check.outputs.sync == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-stack-sync-report-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/sync-report.json

      - name: Update version tracking
        if: steps.check.outputs.sync == 'true'
        run: |
          echo "${{ steps.release.outputs.tag }}" > template/.sphinx-stack-version

      - name: Create pull request
        if: steps.check.outputs.sync == 'true'
        uses: canonical/create-pull-request@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: chore/sync-sphinx-stack-${{ steps.release.outputs.tag }}
          commit-message: "chore: sync template files from sphinx-stack ${{ steps.release.outputs.tag }}"
          title: "chore(deps): sync template files from sphinx-stack ${{ steps.release.outputs.tag }}"
          body: |
            ${{ steps.sync.outputs.report }}

            Review the diff carefully. Files reported under **Needs attention** were not changed automatically.
            To change how an upstream path is handled, edit `scripts/sphinx_stack_sync_policy.json`.
          upsert: true
          ignore-no-changes: true

  analyze-conf-py:
    needs: sync
    # Only run when a sync actually happened and we have a previous version to
    # diff against (the very first run initializes tracking with no old version).
    if: >-
      needs.sync.outputs.sync == 'true' &&
      needs.sync.outputs.old_version != '' &&
      needs.sync.outputs.old_version != needs.sync.outputs.new_version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    steps:
      # Check out the branch the sync job just created so edits land on the
      # existing sync PR rather than a fresh branch.
      - uses: actions/checkout@v7
        with:
          ref: chore/sync-sphinx-stack-${{ needs.sync.outputs.new_version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install analysis dependencies
        run: pip install pyyaml

      - name: Analyze upstream conf.py changes
        id: analyze
        run: |
          OLD="${{ needs.sync.outputs.old_version }}"
          NEW="${{ needs.sync.outputs.new_version }}"
          BASE="https://raw.githubusercontent.com/canonical/sphinx-stack"

          python3 scripts/analyze_conf_diff.py \
            --old-upstream "$BASE/$OLD/docs/conf.py" \
            --new-upstream "$BASE/$NEW/docs/conf.py" \
            --section-map scripts/conf_section_map.json \
            --divergences scripts/conf_divergences.json \
            --requirements template/docs/requirements.txt \
            --copier copier.yml \
            --old-version "$OLD" \
            --new-version "$NEW" \
            --output analysis.json

          echo "--- analysis.json ---"
          cat analysis.json

      - name: Upload analysis report
        uses: actions/upload-artifact@v7
        with:
          name: conf-py-analysis-${{ needs.sync.outputs.new_version }}
          path: analysis.json

      - name: Install Copilot CLI
        if: steps.analyze.outcome == 'success'
        run: npm install -g @github/copilot

        # Agent failures never block the sync PR; it already exists with the
        # verbatim-synced changes and analysis.json is uploaded regardless.
      - name: Apply conf.py.jinja updates (agent)
        id: agent
        if: steps.analyze.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/build_copilot_prompt.py analysis.json > /tmp/prompt.txt
          copilot -p "$(cat /tmp/prompt.txt)" \
            --no-ask-user \
            --model auto \
            --allow-tool='read,write,shell(bash tests/test_build.sh:*)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push agent changes
        if: steps.agent.outcome == 'success'
        run: |
          git add -A -- template/ copier.yml scripts/ skills/
          if git diff --cached --quiet; then
            echo "Agent made no changes to commit."
          else
            git commit -m "chore: apply conf.py.jinja updates from sphinx-stack ${{ needs.sync.outputs.new_version }} analysis"
            git push
          fi

      - name: Post analysis summary as PR comment
        if: always() && steps.analyze.outcome == 'success'
        run: |
          SUMMARY_FILE=/tmp/agent-summary.md
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "## \U0001F916 conf.py.jinja analysis for sphinx-stack ${{ needs.sync.outputs.new_version }}" > "$SUMMARY_FILE"
            echo "" >> "$SUMMARY_FILE"
            echo "The agent step did not produce a summary (it may have failed — see the workflow run logs). \`analysis.json\` is attached to this run as a workflow artifact for manual follow-up." >> "$SUMMARY_FILE"
          fi
          gh pr comment "chore/sync-sphinx-stack-${{ needs.sync.outputs.new_version }}" \
            --body-file "$SUMMARY_FILE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}