name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run lint
        run: uvx tox -e lint

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        scenario: [minimal, full]
    steps:
      - uses: actions/checkout@v7

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Copier
        run: pipx install copier

      - name: Run integration test (${{ matrix.scenario }})
        run: bash tests/test_build.sh ${{ matrix.scenario }}