name: Test Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        scenario: [minimal, full]
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Copier
        run: pipx install copier

      - name: Run integration test (${{ matrix.scenario }})
        run: bash tests/test_build.sh ${{ matrix.scenario }}